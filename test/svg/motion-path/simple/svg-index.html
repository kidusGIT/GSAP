<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP SVG</title>

    <style>
      :root {
        --color-shockingly-green: #0ae448;
        --color-lt-green: #abff84;
        --color-just-black: #0e100f;
        --color-surface-white: #fffce1;
        --color-surface75: #bbbaa6;
      }

      body {
        background-color: #1b1b1d;
        color: #ccc;
        text-align: center;
        padding-top: 1rem;
        margin: 0;
        font-family: Mori, system-ui, sans-serif;
        font-size: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      /* Line */
      #template,
      #path {
        fill: none;
      }

      #template {
        stroke-width: 5px;
        stroke: #444;
      }

      #path {
        stroke: red;
        stroke-width: 10px;
        visibility: visible;
      }

      #macha stop:first-child {
        stop-color: var(--color-shockingly-green);
      }
      #macha stop:last-child {
        stop-color: var(--color-lt-green);
      }

      /* Button */
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5em;
        min-height: 2.5rem;
        padding: 0 1.25rem;
        border: 2px solid var(--color-surface75);
        border-radius: 99px;
        background: transparent;
        color: var(--color-surface75);
        font:
          600 0.9rem/1 Mori,
          system-ui,
          sans-serif;
        cursor: pointer;
        transition:
          border-color 0.2s,
          color 0.2s;
      }

      .container {
        position: relative;
        width: 90vw;
        height: 90vh;
        /* background-color: rgb(0, 87, 128); */
        /* display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: space-evenly; */
        border-radius: 9px;
      }

      button:hover {
        border-color: var(--color-surface-white);
        color: var(--color-surface-white);
      }

      button:focus-visible {
        outline: none;
        border-color: var(--color-shockingly-green);
        box-shadow: 0 0 0 3px rgba(10, 228, 72, 0.35);
      }
    </style>

    <script src="./svg-index.js" type="module" defer></script>
    <link rel="stylesheet" href="./style.css" />
