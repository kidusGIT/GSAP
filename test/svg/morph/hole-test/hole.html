<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP SVG</title>

    <style>
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* background: #0e100f; */
        overflow: hidden;
      }

      .btn {
        padding: 10px;
        padding-left: 15px;
        padding-right: 15px;
        background-color: rgb(25, 92, 179);
        color: white;
        border: none;
        outline: none;
        border-radius: 7px;
        cursor: pointer;
      }

      .btn-wrapper {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .container {
        position: relative;
        width: 90vw;
        height: 90vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-evenly;
        border-radius: 9px;
      }

      #svg-stage {
        width: 60%;
        max-height: 60vh;
        max-width: 500px;
        overflow: visible;
      }

      #gradient {
        height: 0;
      }
    </style>

    <script src="./hole.js" type="module" defer></script>
  </head>
  <body>
    <div class="btn-wrapper">
      <!-- <button class="btn" id="btn-start">Start</button> -->
      <button class="btn" id="btn-play">Play</button>
      <button class="btn" id="btn-reverse">Reverse</button>
      <button class="btn" id="btn-pause">Pause</button>
      <button class="btn" id="btn-resume">Resume</button>
      <button class="btn" id="btn-seek">Seek</button>
    </div>
    <div class="container">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="400"
        height="400"
        viewBox="0 0 124 124"
        fill=""
      >
        <!-- Shape A: Diamond -->
        <!-- Point order: Top (P0), Right (P1), Bottom (P2), Left (P3) -->
        <path id="diamond" d="M 50 10 L 90 50 L 50 90 L 10 50 Z" />

        <!-- Shape B: Square -->
        <!-- Point order: Bottom-Right (P0), Bottom-Left (P1), Top-Left (P2), Top-Right (P3) -->
        <path id="square" fill="none" d="M 80 80 L 20 80 L 20 20 L 80 20 Z" />
      </svg>
    </div>
  </body>
</html>
