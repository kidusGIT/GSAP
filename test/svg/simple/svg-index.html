    <title>GSAP SVG</title>

    <style>
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* background: #0e100f; */
        overflow: hidden;
      }

      .btn {
        padding: 10px;
        padding-left: 15px;
        padding-right: 15px;
        background-color: rgb(25, 92, 179);
        color: white;
        border: none;
        outline: none;
        border-radius: 7px;
        cursor: pointer;
      }

      .btn-wrapper {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .container {
        position: relative;
        width: 90vw;
        height: 90vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-evenly;
        border-radius: 9px;
      }

      #svg-stage {
        width: 60%;
        max-height: 60vh;
        max-width: 500px;
        overflow: visible;
      }

      #gradient {
        height: 0;
      }
    </style>

    <script src="./svg-index.js" type="module" defer></script>
  </head>

      <button class="btn" id="btn-pause">Pause</button>
      <button class="btn" id="btn-resume">Resume</button>
      <button class="btn" id="btn-seek">Seek</button>
    </div>
