<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SVG Morphing: Index vs Polar Matching</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: #0f172a;
        color: #f8fafc;
        margin: 20px;
      }
      .comparison-container {
        display: flex;
        gap: 20px;
        margin-top: 20px;
      }
      .card {
        background: #1e293b;
        padding: 16px;
        border-radius: 12px;
        text-align: center;
        border: 1px solid #334155;
      }
      svg {
        background: #090d16;
        border-radius: 8px;
      }
      path {
        fill: rgba(56, 189, 248, 0.25);
        stroke: #38bdf8;
        stroke-width: 2;
      }
      .centroid {
        fill: #ef4444;
      }
      .start-point {
        fill: #22c55e;
      }
    </style>
  </head>
  <body>
    <h2>SVG Morph Matching Comparison</h2>
    <p>
      Shape A (Square starting at Top-Left) &rarr; Shape B (Circle starting at
      Bottom-Right)
    </p>

    <div class="comparison-container">
      <!-- Naive Index Matching -->
      <div class="card">
        <h3>1. Naive Index Matching</h3>
        <svg id="svg-naive" width="300" height="300"></svg>
        <p style="color: #f87171">Swaps across center &rarr; Self-intersects</p>
      </div>

      <!-- Polar Coordinate Matching -->
      <div class="card">
        <h3>2. Polar Angle Matching</h3>
        <svg id="svg-polar" width="300" height="300"></svg>
        <p style="color: #4ade80">
          Matches by direction &rarr; Direct transition
        </p>
      </div>
    </div>

    <script>
      const SAMPLES = 64;

      // --- Helper Math & Geometry Functions ---

      function getCentroid(points) {
        let cx = 0,
          cy = 0;
        points.forEach((p) => {
          cx += p.x;
          cy += p.y;
        });
        return { x: cx / points.length, y: cy / points.length };
      }

      // Sample points along an SVG Path
      function samplePath(pathD, samples = SAMPLES) {
        const path = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "path",
        );
        path.setAttribute("d", pathD);
        const len = path.getTotalLength();
        const points = [];
        for (let i = 0; i < samples; i++) {
          const p = path.getPointAtLength((i / samples) * len);
          points.push({ x: p.x, y: p.y });
        }
        return points;
      }

      // --- Core Matcher Implementations ---

      /**
       * NAIVE MATCHING: Directly preserves original array index (0 to 0, 1 to 1...)
       */
      function matchByNaiveIndex(sourcePoints, targetPoints) {
        return targetPoints; // Unchanged array
      }

      /**
       * POLAR MATCHING: Pairs points by closest direction angle relative to centroids
       */
      function matchByPolarAngle(sourcePoints, targetPoints) {
        const centerA = getCentroid(sourcePoints);
        const centerB = getCentroid(targetPoints);

        // Compute polar angle atan2(dy, dx) for each target point
        const targetWithAngles = targetPoints.map((p) => ({
          point: p,
          angle: Math.atan2(p.y - centerB.y, p.x - centerB.x),
        }));

        // For every source point, pick target point with closest polar angle
        return sourcePoints.map((pA) => {
          const angleA = Math.atan2(pA.y - centerA.y, pA.x - centerA.x);

          let bestMatch = targetWithAngles[0].point;
          let minDiff = Infinity;

          for (const candidate of targetWithAngles) {
            // Calculate angular difference normalized to [-PI, PI]
            let diff = Math.abs(
              Math.atan2(
                Math.sin(candidate.angle - angleA),
                Math.cos(candidate.angle - angleA),
              ),
            );

            if (diff < minDiff) {
              minDiff = diff;
              bestMatch = candidate.point;
            }
          }
          return bestMatch;
        });
      }

      // Convert Point Set to SVG Path Data 'd' string
      function pointsToPath(points) {
        return (
          points.reduce(
            (acc, p, i) =>
              acc + (i === 0 ? `M ${p.x} ${p.y}` : ` L ${p.x} ${p.y}`),
            "",
          ) + " Z"
        );
      }

      // --- Setup Shapes ---
      // Shape A: Square starting at TOP-LEFT (100, 100)
      const dSquare = "M 100 100 L 200 100 L 200 200 L 100 200 Z";

      // Shape B: Circle starting at BOTTOM-RIGHT (~200, 150)
      const dCircle = "M 200 150 A 50 50 0 1 1 199.99 150 Z";

      const pointsA = samplePath(dSquare);
      const pointsB = samplePath(dCircle);

      // Prepare point sets
      const naiveTarget = matchByNaiveIndex(pointsA, pointsB);
      const polarTarget = matchByPolarAngle(pointsA, pointsB);

      // --- Setup Renderers ---
      function setupSVG(id, targetSet) {
        const svg = document.getElementById(id);
        svg.innerHTML = `
        <path id="${id}-path" d="" />
        <circle id="${id}-start" class="start-point" r="5" />
        <circle class="centroid" cx="150" cy="150" r="4" />
      `;

        const pathEl = document.getElementById(`${id}-path`);
        const startEl = document.getElementById(`${id}-start`);

        let progress = 0;
        let direction = 1;

        // Animate transition (Oscillates progress t between 0 and 1)
        function animate() {
          progress += 0.008 * direction;
          if (progress >= 1 || progress <= 0) direction *= -1;

          // Linear interpolation (Lerp)
          const currentPoints = pointsA.map((pA, i) => {
            const pB = targetSet[i];
            return {
              x: pA.x + (pB.x - pA.x) * progress,
              y: pA.y + (pB.y - pA.y) * progress,
            };
          });

          pathEl.setAttribute("d", pointsToPath(currentPoints));
          startEl.setAttribute("cx", currentPoints[0].x);
          startEl.setAttribute("cy", currentPoints[0].y);

          requestAnimationFrame(animate);
        }

        animate();
      }

      setupSVG("svg-naive", naiveTarget);
      setupSVG("svg-polar", polarTarget);
    </script>
  </body>
</html>
